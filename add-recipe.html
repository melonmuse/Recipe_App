<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookNote: AI Recipe Book</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">🍳 CookNote</a>
        <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="add-recipe.html" class="active">Create Recipe</a></li>
        </ul>
    </nav>
    <main>
        <div class="card">
        <h2>Create New Recipe</h2>
        <div id="message" class="message" hidden></div>
        <form id="upload_form">
            <div class="form-group">
            <label for="recipe_title">Recipe title</label>
            <input type="text" id="recipe_title" placeholder="e.g. Fluffy Pancakes">
            </div>

            <div class="form-group">
            <label>Ingredients</label>
            <div id="ingredients_container">
            </div>
            </div>

            <div class="form-group">
            <label for="instructions">Instructions</label>
            <textarea id="instructions" placeholder="1. Gather all the ingredients"></textarea>
            </div>
            
            <button class="btn-primary" type="submit">Upload Recipe</button>
            <button type="button" id="cancel_btn">Cancel</button>
        
        </form> 
        </div>
    </main>
    <footer>
        CookNote: AI Recipe Book · SWE 401 Prototype
    </footer>
    <script src="js/add-recipe.js"></script>
</body>
</html>
